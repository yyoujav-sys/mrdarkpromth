name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mr_darkpromth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mr_darkpromth_test
          REDIS_URL: redis://localhost:6379
          RUST_LOG: debug
        run: |
          cargo test --verbose --workspace

      - name: Ultra Tier Integration Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mr_darkpromth_test
          REDIS_URL: redis://localhost:6379
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cargo test --package mr_darkpromth_services ultra_tier_integration_tests -- --nocapture

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  e2e-load:
    name: E2E & Load Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mr_darkpromth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mr_darkpromth_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      CEREBRAS_API_KEYS: csk-test-key
      RUST_LOG: info

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run database migrations
        env:
          PGPASSWORD: postgres
        run: |
          for file in migrations/*.sql; do
            psql -h localhost -U postgres -d mr_darkpromth_test -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Start API server
        run: |
          cargo run -p mr_darkpromth_api &
          for i in {1..30}; do
            if curl -fs http://localhost:8080/health; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start" && exit 1

      - name: Run Playwright E2E
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_WS_URL: ws://localhost:8080/ws
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run e2e

      - name: Seed load test user
        env:
          PGPASSWORD: postgres
        run: |
          curl -fs http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"loadtest","email":"loadtest@example.com","password":"TestPass123!"}'
          psql -h localhost -U postgres -d mr_darkpromth_test -v ON_ERROR_STOP=1 \
            -c "UPDATE users SET tier = 'premium' WHERE email = 'loadtest@example.com';"

      - name: Run sandbox load test
        uses: grafana/k6-action@v0.3.1
        env:
          LOAD_TEST_BASE_URL: http://localhost:8080
          SANDBOX_AUTH_EMAIL: loadtest@example.com
          SANDBOX_AUTH_PASSWORD: TestPass123!
          LOAD_VUS: 5
          LOAD_DURATION: 30s
          LOAD_SLEEP: 1
        with:
          filename: load-tests/sandbox-execution.js

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Build release
        run: cargo build --release --workspace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: target/release/mr_darkpromth

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build, e2e-load]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'