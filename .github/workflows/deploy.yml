name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api_dockerfile_with_metrics
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-api:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-frontend:latest

      - name: Deploy to production
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/mrdarkpromth
            
            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-api:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-frontend:latest
            
            # Stop and remove old containers
            docker stop mr_darkpromth_api mr_darkpromth_frontend || true
            docker rm mr_darkpromth_api mr_darkpromth_frontend || true
            
            # Start new containers
            docker run -d --name mr_darkpromth_api --network mr_darkpromth_network -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-api:latest
            docker run -d --name mr_darkpromth_frontend --network mr_darkpromth_network -p 3000:80 ${{ secrets.DOCKER_USERNAME }}/mr-darkpromth-frontend:latest
            
            # Run health checks
            sleep 10
            curl -f http://localhost:8080/health || exit 1
            curl -f http://localhost:3000 || exit 1
            
            echo "Deployment completed successfully!"

      - name: Run smoke tests
        run: |
          sleep 15
          curl -f https://bt-shop-dark.online/health
          curl -f https://bt-shop-dark.online/api/status

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Deployment to production completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
