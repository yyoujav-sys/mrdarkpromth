# MR.DarkPromth Default Configuration

[server]
host = "0.0.0.0"
port = 8080
max_connections = 1000
timeout_seconds = 30

[database]
url = "postgres://postgres:postgres@localhost:5432/mr_darkpromth"
max_connections = 10
min_connections = 2
connection_timeout = 30

[redis]
url = "redis://localhost:6379"
max_connections = 10
connection_timeout = 5

[logging]
level = "info"
format = "json"
file = "logs/app.log"
max_file_size = "100MB"
max_files = 10

[security]
jwt_secret = ""  # Set via environment variable
jwt_expiration_hours = 24
session_timeout_minutes = 60
rate_limit_requests = 100
rate_limit_window_seconds = 60

[cerebras]
api_keys = []  # Set via environment variable
default_model = "llama-3.3-70b"
timeout_seconds = 30
max_retries = 3

[agents]
coordination_enabled = true
heartbeat_interval_seconds = 30
event_bus_enabled = true
memory_log_enabled = true

[ultra_tier]
consent_required = true
activation_enabled = true
audit_enabled = true
sandbox_enabled = true
