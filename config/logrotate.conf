# MR.DarkPromth Log Rotation Configuration
# Place this file in /etc/logrotate.d/mrdarkpromth

# Application logs
/opt/mrdarkpromth/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        # Signal the application to reopen log files if needed
        docker kill --signal=USR1 mr_darkpromth_api 2>/dev/null || true
    endscript
}

# Nginx logs
/opt/mrdarkpromth/logs/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        docker exec mr_darkpromth_nginx nginx -s reopen 2>/dev/null || true
    endscript
}

# API debug logs (shorter retention)
/opt/mrdarkpromth/api*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}

# Build logs (shorter retention)
/opt/mrdarkpromth/build*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
