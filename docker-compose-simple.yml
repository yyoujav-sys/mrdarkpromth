services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mr_darkpromth_postgres
    environment:
      POSTGRES_DB: mr_darkpromth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - mr_darkpromth_network

  # Redis for Event Bus
  redis:
    image: redis:7-alpine
    container_name: mr_darkpromth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mr_darkpromth_network

volumes:
  postgres_data:
  redis_data:

networks:
  mr_darkpromth_network:
    driver: bridge
