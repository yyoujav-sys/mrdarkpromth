version: '3.8'

services:
  # Agent 4: Jailbreak & Ultra Tier Engineer
  agent4:
    build:
      context: .
      dockerfile: Dockerfile.agent4
    container_name: mr-darkpromth-agent4
    ports:
      - "8084:8084"  # Use different port to avoid conflict
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_ID=agent4
      - PORT=8084
      - RUST_LOG=info
      - DATABASE_URL=postgresql://postgres:5432/mr_darkpromth
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - redis
      - postgres
    networks:
      - mr-darkpromth-network
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    platform: linux/amd64  # Explicitly set platform for Docker Desktop

  # Redis for coordination
  redis:
    image: redis:7-alpine
    container_name: mr-darkpromth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mr-darkpromth-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    platform: linux/amd64  # Explicitly set platform for Docker Desktop

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: mr-darkpromth-postgres
    environment:
      - POSTGRES_DB=mr_darkpromth
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - mr-darkpromth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    platform: linux/amd64  # Explicitly set platform for Docker Desktop

volumes:
  redis_data:
  postgres_data:

networks:
  mr-darkpromth-network:
    driver: bridge
