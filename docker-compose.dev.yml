version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mr_darkpromth_postgres_dev
    environment:
      POSTGRES_DB: mr_darkpromth_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - mr_darkpromth_network_dev

  # Redis for Event Bus
  redis:
    image: redis:7-alpine
    container_name: mr_darkpromth_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - mr_darkpromth_network_dev

  # MR.DarkPromth Backend Service (Development)
  mr_darkpromth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mr_darkpromth_backend_dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mr_darkpromth_dev
      REDIS_URL: redis://redis:6379
      RUST_LOG: debug
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      AGENT_COORDINATION_ENABLED: "true"
      HEARTBEAT_INTERVAL_SECONDS: "15"
      MEMORY_LOG_ENABLED: "true"
      CONFIG_ENV: development
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
      - ./src:/app/src
      - ./mr_darkpromth:/app/mr_darkpromth
    networks:
      - mr_darkpromth_network_dev
    command: /bin/sh -c "while true; do sleep 1; done"

# Nginx Reverse Proxy (Development)
  nginx:
    image: nginx:alpine
    container_name: mr_darkpromth_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      mr_darkpromth:
        condition: service_healthy
    networks:
      - mr_darkpromth_network_dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  mr_darkpromth_network_dev:
    driver: bridge
