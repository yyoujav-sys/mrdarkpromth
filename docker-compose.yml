version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mr_darkpromth_postgres
    environment:
      POSTGRES_DB: mr_darkpromth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - mr_darkpromth_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Event Bus
  redis:
    image: redis:7-alpine
    container_name: mr_darkpromth_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mr_darkpromth_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MR.DarkPromth Backend Service
  mr_darkpromth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mr_darkpromth_backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mr_darkpromth
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AGENT_COORDINATION_ENABLED: "true"
      HEARTBEAT_INTERVAL_SECONDS: "30"
      MEMORY_LOG_ENABLED: "true"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
    networks:
      - mr_darkpromth_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mr_darkpromth_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      mr_darkpromth:
        condition: service_healthy
    networks:
      - mr_darkpromth_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  mr_darkpromth_network:
    driver: bridge
