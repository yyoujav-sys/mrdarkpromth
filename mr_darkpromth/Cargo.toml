[workspace]
members = [
    "api",
    "core",
    "services",
    "db",
]
resolver = "2"

[workspace.dependencies]
# Pin versions to avoid edition2024 issues
actix-web = "4.4"
actix-cors = "0.6"
tokio = "1.35"
serde = "1.0"
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal", "macros"], default-features = false }
redis = "0.24"
uuid = "1.6"
chrono = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
reqwest = "0.11"
jsonwebtoken = "9.3"
bcrypt = "0.15"
dotenvy = "0.15"
