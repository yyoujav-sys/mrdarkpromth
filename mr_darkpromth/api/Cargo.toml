[package]
name = "mr_darkpromth_api" 
version = "0.1.0" 
edition = "2021" 

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "ws"] } 
tokio = { version = "1.0", features = ["full"] } 
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower_governor = { version = "0.4", features = ["axum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10"
lazy_static = "1.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal", "macros"], default-features = false }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
anyhow = "1.0"
futures = "0.3"
regex = "1.10"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
redis = { version = "0.25", features = ["tokio-comp"] }
mr_darkpromth_core = { path = "../core" }
mr_darkpromth_services = { path = "../services" }
mr_darkpromth_db = { path = "../db" }
urlencoding = "2.1"
