[package]
name = "mr_darkpromth_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "5", features = ["axum"] }
redis = { version = "0.24", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "=0.3.45"
jsonwebtoken = "9.3"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
futures-util = "0.3"
mr_darkpromth_services = { path = "../services" }
mr_darkpromth_db = { path = "../db" }
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"], default-features = false }
dotenvy.workspace = true
tower_governor = { version = "0.4", features = ["axum"] }
