[package]
name = "mr_darkpromth_api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.6"
actix-rt = "2.9"
actix-ws = "0.3"
actix = "0.13"
actix-web-actors = "4.2"
utoipa = { version = "4.2", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "4.0", features = ["actix-web"] }
redis = "0.23"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "8.3"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
futures-util = "0.3"
mr_darkpromth_services = { path = "../services" }
mr_darkpromth_db = { path = "../db" }
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"], default-features = false }
