[package]
name = "mr_darkpromth_core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.29"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
redis = { version = "0.25", features = ["tokio-comp"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
log = "0.4"
thiserror = "1.0"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
argon2 = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rand = "0.8"
axum = { version = "0.8", features = ["json", "macros"] }
jsonwebtoken = "9.3"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal", "macros"], default-features = false }
