[package]
name = "mr_darkpromth_services"
version = "0.1.0"
edition = "2021"

[lib]
name = "mr_darkpromth_services"
path = "src/lib.rs"

[dependencies]
dotenv = "0.15.0"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.25", features = ["tokio-comp"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream", "blocking", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
regex = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
cerebras_client = { path = "./cerebras_client" }
async-trait = "0.1"
# Security dependencies
crypto-common = "0.1"
url = "2.4"
sha2 = "0.10"
hmac = "0.12"
ring = "0.16"
# Sandboxing dependencies
nix = { version = "0.27", features = ["user", "signal", "process"] }
libc = "0.2"
# Rate limiting
governor = "0.6"
# Resource monitoring
sysinfo = "0.29"
tempfile = "3.0"
md5 = "0.7"
walkdir = "2"

# Authentication dependencies
argon2 = "0.4"
jsonwebtoken = "9.3"
mr_darkpromth_db = { path = "../db" }
mr_darkpromth_core = { path = "../core" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal", "macros"], default-features = false }

# Email dependencies
lettre = { version = "0.10", default-features = false, features = ["smtp-transport", "builder", "pool", "tokio1", "tokio1-rustls-tls"] }
qrcode = "0.12"
image = "0.24"
base64 = "0.21"

# Web framework dependencies for API
axum = { version = "0.8", features = ["json", "macros"] }
# actix-web = "4.4"
# actix-cors = "0.6"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
redis = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
tempfile = "3.0"
