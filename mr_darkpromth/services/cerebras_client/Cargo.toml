[package]
name = "cerebras_client"
version = "0.1.0"
edition = "2021"
description = "Cerebras.ai API client for MR.DarkPromth"
license = "UNLICENSED"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
