user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name bt-shop-dark.online www.bt-shop-dark.online;
        
        # Let's Encrypt ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        
        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name bt-shop-dark.online www.bt-shop-dark.online;

        # SSL certificates
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Simple response page
        location / {
            return 200 '<!DOCTYPE html><html><head><title>MR.DarkPromth</title></head><body><h1>🚀 MR.DarkPromth is running!</h1><p>SSL certificate successfully installed.</p><p>Domain: bt-shop-dark.online</p></body></html>';
            add_header Content-Type text/html;
        }
    }
}
