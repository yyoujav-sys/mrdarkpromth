[package]
name = "cerebras_client"
version = "0.1.0"
edition = "2021"
description = "Cerebras.ai API client for MR.DarkPromth"
license = "UNLICENSED"

[dependencies]
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
